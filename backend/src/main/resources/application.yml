server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: ShoppingHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    async:
      request-timeout: 30000

# JWT配置
jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024Shopping
  expiration: 86400000

# 文件上传路径
file:
  upload-dir: ./uploads

# 跨域配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175

# 支付配置
payment:
  timeout-minutes: 30
