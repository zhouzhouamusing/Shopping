server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping_db?&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT配置
jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024Shopping
  expiration: 86400000

# 文件上传路径
file:
  upload-dir: ./uploads

# 跨域配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,,http://localhost:5175
